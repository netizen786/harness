<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HARNESS</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="stylesheet" href="./src/styles/tokens.css">
  <link rel="stylesheet" href="./src/styles/app.css">
  <script type="importmap">
  { "imports": { "harness/": "./src/", "pyodide/": "https://cdn.jsdelivr.net/pyodide/v0.28.0/full/" } }
  </script>
  <script>
    // Capture boot errors in ordinary HTML so even a failed module graph can
    // report the actual rejected import rather than leaving a loading skeleton.
    (() => {
      let reported = false;
      let watchdog;

      function isMounted() {
        const app = document.getElementById('app-root');
        const skeleton = document.getElementById('app-skeleton');
        return Boolean(app && !app.hidden && skeleton?.hidden);
      }

      function showStartupError(error, details = '') {
        if (reported || isMounted()) return;
        reported = true;
        window.clearTimeout(watchdog);

        const skeleton = document.getElementById('app-skeleton');
        if (!skeleton) return;
        skeleton.replaceChildren();
        skeleton.style.color = 'var(--color-text, #f5f5f5)';
        skeleton.style.justifyContent = 'center';
        skeleton.style.alignItems = 'stretch';
        skeleton.style.fontFamily = 'var(--font-sans, system-ui, sans-serif)';
        skeleton.style.overflow = 'auto';

        const panel = document.createElement('section');
        panel.setAttribute('role', 'alert');
        panel.setAttribute('aria-live', 'assertive');
        panel.style.cssText = 'max-width:760px;margin:auto;padding:24px;border:1px solid #713b3b;border-radius:12px;background:#171212;display:grid;gap:12px';

        const heading = document.createElement('h2');
        heading.textContent = 'HARNESS could not start';
        const summary = document.createElement('p');
        summary.textContent = error || 'The app failed before its interface mounted.';
        panel.append(heading, summary);

        if (details) {
          const detail = document.createElement('pre');
          detail.textContent = details;
          detail.style.cssText = 'white-space:pre-wrap;overflow-wrap:anywhere;max-height:30vh;overflow:auto;padding:12px;background:#0a0a0a;border-radius:6px';
          panel.append(detail);
        }

        const advice = document.createElement('p');
        advice.textContent = 'The message above is the startup failure. Check the browser Network tab for a missing module or failed request. If deployed with GitHub Pages, verify the latest deployment completed and reload with cache disabled.';
        panel.append(advice);

        const actions = document.createElement('div');
        actions.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap';
        const refresh = document.createElement('button');
        refresh.type = 'button';
        refresh.textContent = 'Reload app';
        refresh.addEventListener('click', () => window.location.reload());
        const copy = document.createElement('button');
        copy.type = 'button';
        copy.textContent = 'Copy error details';
        copy.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText([error, details].filter(Boolean).join('\n\n'));
            copy.textContent = 'Copied';
          } catch {
            copy.textContent = 'Clipboard unavailable';
          }
        });
        actions.append(refresh, copy);
        panel.append(actions);
        skeleton.append(panel);
        skeleton.hidden = false;
        const app = document.getElementById('app-root');
        if (app) app.hidden = true;
        console.error('[HARNESS startup]', error, details);
      }

      window.__HARNESS_SHOW_STARTUP_ERROR__ = showStartupError;

      window.addEventListener('error', event => {
        if (isMounted()) return;
        if (event.target instanceof HTMLScriptElement || event.target === window) {
          const location = event.filename ? `${event.filename}:${event.lineno || 0}:${event.colno || 0}` : '';
          showStartupError(event.message || `Failed to load ${event.target?.src || 'the app script'}`, [location, event.error?.stack].filter(Boolean).join('\n'));
        }
      }, true);

      window.addEventListener('unhandledrejection', event => {
        if (isMounted()) return;
        const reason = event.reason;
        showStartupError(reason?.message || String(reason || 'App startup failed.'), reason?.stack || 'Unhandled promise rejection during startup.');
      });

      document.addEventListener('DOMContentLoaded', () => {
        watchdog = window.setTimeout(() => {
          if (!isMounted()) {
            showStartupError('The app did not mount within 15 seconds. Startup may be stuck or a JavaScript module may have failed to load.', 'No successful app mount was detected before the startup watchdog expired.');
          }
        }, 15000);
      }, { once: true });
    })();
  </script>
</head>
<body>
  <div id="app-skeleton" class="skeleton-container">
    <div class="skeleton-header"></div>
    <div class="skeleton-main"><div class="skeleton-panel"></div><div class="skeleton-panel"></div></div>
    <div class="skeleton-footer"></div>
  </div>
  <x-app id="app-root" hidden></x-app>
  <div id="sw-update-toast" class="toast hidden">
    <span>Update available. <button id="sw-reload-btn">Refresh</button></span>
  </div>
  <script>
    // Dynamic import gives us a rejection we can display, including failures in
    // any nested import, instead of relying on the browser's generic module error.
    import('./src/main.js').catch(error => {
      window.__HARNESS_SHOW_STARTUP_ERROR__(
        error?.message || String(error),
        error?.stack || 'Failed to import ./src/main.js or one of its dependencies.'
      );
    });
  </script>
</body>
</html>
