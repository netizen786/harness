<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HARNESS</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="stylesheet" href="./src/styles/tokens.css">
  <link rel="stylesheet" href="./src/styles/app.css">
  <script type="importmap">
  { "imports": { "harness/": "./src/", "pyodide/": "https://cdn.jsdelivr.net/pyodide/v0.28.0/full/" } }
  </script>
  <script>
    // A module import or network failure can stop src/main.js before it gets a
    // chance to hide the skeleton. Surface that failure instead of spinning forever.
    (() => {
      let reported = false;
      function showStartupError(error) {
        if (reported) return;
        reported = true;

        const skeleton = document.getElementById('app-skeleton');
        if (!skeleton) return;
        skeleton.replaceChildren();
        skeleton.style.color = 'var(--color-text)';
        skeleton.style.justifyContent = 'center';
        skeleton.style.fontFamily = 'var(--font-sans)';

        const heading = document.createElement('h2');
        heading.textContent = 'HARNESS could not start';
        const detail = document.createElement('p');
        detail.textContent = error || 'The app entry module did not finish loading. Check the browser console and network requests.';
        const refresh = document.createElement('button');
        refresh.type = 'button';
        refresh.textContent = 'Reload app';
        refresh.addEventListener('click', () => window.location.reload());

        skeleton.append(heading, detail, refresh);
        skeleton.hidden = false;
        const app = document.getElementById('app-root');
        if (app) app.hidden = true;
      }

      window.addEventListener('error', event => {
        if (event.target instanceof HTMLScriptElement || event.target === window) {
          showStartupError(event.message || `Failed to load ${event.target?.src || 'the app script'}`);
        }
      }, true);
      window.addEventListener('unhandledrejection', event => {
        showStartupError(event.reason?.message || String(event.reason || 'App startup failed.'));
      });

      // Also handle a missing or stalled entry module that emits no useful event.
      window.setTimeout(() => {
        if (!customElements.get('x-app')) {
          showStartupError('The app entry module did not register the interface. Check the browser console and network requests.');
        }
      }, 20000);
    })();
  </script>
</head>
<body>
  <div id="app-skeleton" class="skeleton-container">
    <div class="skeleton-header"></div>
    <div class="skeleton-main"><div class="skeleton-panel"></div><div class="skeleton-panel"></div></div>
    <div class="skeleton-footer"></div>
  </div>
  <x-app id="app-root" hidden></x-app>
  <div id="sw-update-toast" class="toast hidden">
    <span>Update available. <button id="sw-reload-btn">Refresh</button></span>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
